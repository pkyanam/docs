name: update portfolio from github

# refreshes the auto-generated "latest from github" feed and the live stats
# numbers daily. committing the changes back to main triggers a mintlify
# rebuild, so the site stays current without any server-side code.

on:
  schedule:
    - cron: "17 7 * * *" # daily at 07:17 utc
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: run updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_projects.py

      - name: commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add projects/index.mdx stats.mdx
            git commit -m "chore: refresh live github data"
            git push
          else
            echo "no changes to commit"
          fi
